{% extends "base.html" %}{% block title %}Sign in · FaceAttend{% endblock %}
{% block bare %}<div class="login"><form method="post" class="card">
<h1>Face<span style="color:var(--brand)">Attend</span></h1><p class="sub">Lecturer sign in</p>
{% if err %}<div class="alert bad">{{ err }}</div>{% endif %}
<input type="password" name="pw" placeholder="Password" style="width:100%" autofocus>
<button style="width:100%">Sign in</button>
<p class="sub" style="margin:14px 0 0;text-align:center"><a href="/forgot">Forgot password?</a></p></form></div>{% endblock %}
